name: Planning Materialization PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/planning_issue_specs.py
      - .github/scripts/planning_materialize.py
      - .github/workflows/planning-materialize-pr.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'planning/roadmap-coverage-inventory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and reconcile roadmap planning system
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PYTHONPATH: .github/scripts
        run: |
          sed -i 's/rr(174, 184)/rr(174, 181) + [183, 184]/' .github/scripts/planning_issue_specs.py
          python .github/scripts/planning_materialize.py
