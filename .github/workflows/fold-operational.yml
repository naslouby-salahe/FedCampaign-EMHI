name: fold-operational
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/roadmap-completion
      - name: Fold operational scorer into canonical owner
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/fedcampaign_emhi/evaluation/operational.py').read_text()
          target = Path('src/fedcampaign_emhi/evaluation/campaign_replay.py')
          original = target.read_text()
          start = source.index('def _rank_at_epoch(')
          end = source.index('def calibrate_global_operating_point(')
          scoring = source[start:end]
          scoring = scoring.replace('_rank_at_epoch', 'rank_at_epoch').replace('_score_at_epoch', 'score_at_epoch').replace('_scores_for_epochs', 'scores_for_epochs')
          scoring = scoring.replace('_trajectory_stop_position', 'trajectory_stop_position').replace('_horizon_trajectory', 'horizon_trajectory')
          imports = original.split('\n\n', 1)[0]
          body = original[len(imports):]
          extra_imports = '''\nfrom fedcampaign_emhi.artifacts.records import (\n    CampaignRecord,\n    CoalitionFitRecord,\n    DetectorScoreArtifactRecord,\n    EMHIFitArtifactRecord,\n    MarginalRankArtifactRecord,\n    OrderContextFitRecord,\n    ProjectionCellFitRecord,\n)\nfrom fedcampaign_emhi.config.schema import ScientificConfig\nfrom fedcampaign_emhi.detection.local_policy import first_local_stop_epoch, score_exceeds_threshold\nfrom fedcampaign_emhi.domain.enums import ClaimState, CoalitionOrder\nfrom fedcampaign_emhi.domain.types import (\n    BinIndex,\n    ClientId,\n    CoalitionMembers,\n    EvidenceFactor,\n    Probability,\n    RankReference,\n    RankValue,\n    ThresholdValue,\n)\nfrom fedcampaign_emhi.emhi.basis import tensor_representation\nfrom fedcampaign_emhi.emhi.contexts import assign_context_cell, exact_exclusion_members, outside_context_histogram\nfrom fedcampaign_emhi.emhi.evidence import across_order_aggregate, operational_evidence_factor, within_order_aggregate\nfrom fedcampaign_emhi.emhi.innovations import center_and_scale_atom, projection_residual\nfrom fedcampaign_emhi.emhi.projection import proper_subset_design_row\nfrom fedcampaign_emhi.emhi.ranks import coalition_conditioned_residual_rank\nfrom fedcampaign_emhi.emhi.sequential import coalition_materially_active, first_global_stop_epoch, trailing_window_support_predicate\nfrom fedcampaign_emhi.evaluation.records import (\n    ClientLocalOperatingPoint,\n    CoalitionEpochEvidence,\n    EpochOperationalEvidence,\n    SequentialTrajectory,\n)\n'''
          target.write_text(imports + extra_imports + body.rstrip() + '\n\n' + scoring.rstrip() + '\n')
          PY
          uv sync --extra dev --locked
          uv run ruff format src/fedcampaign_emhi/evaluation/campaign_replay.py
          uv run ruff check --fix src/fedcampaign_emhi/evaluation/campaign_replay.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fedcampaign_emhi/evaluation/campaign_replay.py
          git commit -m 'Fold operational scoring into canonical evaluation owner'
          git push origin HEAD:audit/roadmap-completion
