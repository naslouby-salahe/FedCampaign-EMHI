name: audit-ci

on:
  pull_request:
  push:
    branches:
      - main
      - audit/roadmap-completion

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev --locked
      - run: uv run pytest
        id: pytest
        continue-on-error: true
      - run: uv run pyright
        id: pyright
        continue-on-error: true
      - run: uv run semgrep --config .semgrep.yml src
        id: semgrep
        continue-on-error: true
      - run: uv run lint-imports
        id: imports
        continue-on-error: true
      - run: uv run ruff format --check src tests
        id: format
        continue-on-error: true
      - run: uv run ruff check src tests
        id: lint
        continue-on-error: true
      - run: uv run deptry .
        id: deptry
        continue-on-error: true
      - run: uv run vulture src --min-confidence 100
        id: vulture
        continue-on-error: true
      - name: Enforce verification result
        if: always()
        run: |
          test "${{ steps.pytest.outcome }}" = success
          test "${{ steps.pyright.outcome }}" = success
          test "${{ steps.semgrep.outcome }}" = success
          test "${{ steps.imports.outcome }}" = success
          test "${{ steps.format.outcome }}" = success
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.deptry.outcome }}" = success
          test "${{ steps.vulture.outcome }}" = success
