name: audit-ci

on:
  pull_request:
  push:
    branches:
      - audit/roadmap-completion

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev --locked
      - run: uv run pytest
        id: pytest
        continue-on-error: true
      - run: uv run pyright
        id: pyright
        continue-on-error: true
      - run: uv run lint-imports
        id: imports
        continue-on-error: true
      - name: Enforce verification result
        if: always()
        run: |
          test "${{ steps.pytest.outcome }}" = success
          test "${{ steps.pyright.outcome }}" = success
          test "${{ steps.imports.outcome }}" = success
